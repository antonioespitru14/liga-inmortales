<script>
// Versión web (fuera de Claude): sustituye claude.use('db'/'user') por Firebase (Firestore + login con Google).
(function () {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !window.firebase) { window.LIGA_WEB = { sinConfig: true }; window.claude = { use: async () => null }; return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore();
  try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) { console.warn(e); }
  const proveedor = new firebase.auth.GoogleAuthProvider();
  const W = window.LIGA_WEB = {
    usuario: null, propietario: null, esPropietario: false,
    entrar: () => auth.signInWithPopup(proveedor).then(() => location.reload()).catch(e => {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) return auth.signInWithRedirect(proveedor);
      console.error(e); alert('No se pudo entrar: ' + (e.message || e.code));
    }),
    salir: () => auth.signOut().then(() => location.reload()),
    reclamarPropietario: () => fs.doc('liga/propietario').set({ uid: W.usuario.uid, admins: [], creado: new Date().toISOString() }).then(() => location.reload()),
    guardarAdmins: admins => fs.doc('liga/propietario').update({ admins }).then(() => { W.propietario = { ...W.propietario, admins }; }),
  };
  const primerEstado = new Promise(r => { const off = auth.onAuthStateChanged(u => { off(); r(u); }); });
  const listo = (async () => {
    const u = await primerEstado; W.usuario = u;
    try { const p = await fs.doc('liga/propietario').get(); W.propietario = p.exists ? p.data() : null; } catch (e) { console.warn(e); }
    W.esPropietario = !!(u && W.propietario && W.propietario.uid === u.uid);
    if (u) fs.doc('usuarios/' + u.uid).set({ name: u.displayName || 'Participante' }, { merge: true }).catch(e => console.warn(e));
  })();
  window.claude = {
    use: async nombre => {
      await listo;
      if (nombre === 'db') return fs;
      if (nombre === 'user') return {
        id: async () => W.usuario ? W.usuario.uid : null,
        canEdit: async () => !!(W.usuario && W.propietario && (W.propietario.uid === W.usuario.uid || (W.propietario.admins || []).includes(W.usuario.uid))),
        profiles: async ids => Object.fromEntries(await Promise.all(ids.map(async id => {
          try { const d = await fs.doc('usuarios/' + id).get(); return [id, d.exists ? d.data() : null]; } catch { return [id, null]; }
        }))),
      };
      return null;
    },
  };
})();

* { box-sizing: border-box; }

/* ---------- Escrituras ---------- */
function confirmar(btn, fn) {
  if (btn.dataset.confirm !== '1') { const t = btn.textContent; btn.dataset.confirm = '1'; btn.textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { if (btn.isConnected) { btn.dataset.confirm = ''; btn.textContent = t; } }, 4000); return; }
  fn();
}
async function guardar(fn, ok) {
  if (!S.db || !S.yo) { toast(window.LIGA_WEB ? 'Para guardar, entra con tu cuenta de Google (botón Entrar, arriba).' : 'Para guardar tienes que abrir la página con tu cuenta.'); return false; }
  try { await fn(); toast(ok); return true; }
  catch (e) { console.error(e); toast(e?.code === 'quota_exceeded' ? 'La liga ha llegado a su límite de datos.' : 'No se pudo guardar. Puede que no tengas permiso para este cambio.'); return false; }
}

function guardarAjustes(cambio, ok) {

}
function reclamar(eid) {

}
async function guardarAlineacion(eid, ab) {

// Quitar a alguien no borra sus alineaciones pasadas: siguen contando para las jornadas en que las guardó.
function liberar(uid) {
  const d = S.alineaciones.find(a => a._id === uid);
  const historial = Object.fromEntries(Object.entries(d?.historial || {}).map(([k, e]) => [k, { ...e, equipo: e.equipo || d.equipo }]));
  guardar(() => S.db.doc('alineaciones/' + uid).update({ equipo: null, historial }), 'Hecho. Esa cuenta ya no gestiona el equipo.');

// Jornadas a comprobar: desde la indicada hasta la última en la que algún fichaje cambia algo.
function jornadasDesde(desde) {
  const fin = Math.max(desde, jornadaAbierta(), ...movimientos().map(m => m.desdeJornada));
  return Array.from({ length: fin - desde + 1 }, (_, i) => desde + i);
}
function dueñoDe(jid, jornada) { return participantes().find(p => plantillaEn(p.id, jornada).includes(jid)) || null; }
function libreDesde(jid, desde) { return jornadasDesde(desde).every(n => !dueñoDe(jid, n)); }
function validarFichaje(eid, entra, sale, desde) {
  if (!entra || !sale) return 'Un fichaje es «x por y»: elige a quién fichas y a quién sueltas.';
  if (!plantillaEn(eid, desde).includes(sale)) return `${jug(sale).n} no está en la plantilla de ${part(eid).nombre} en la jornada ${desde}.`;
  for (const n of jornadasDesde(desde)) { const d = dueñoDe(entra, n); if (d) return `${jug(entra).n} no está libre: lo tiene ${d.nombre} en la jornada ${n}.`; }
  return null;
}
function crearMovimiento() {
  const sale = $('#movSale').value, entra = $('#movEntra').value;
  const eid = $('#movPart').value, desde = Math.max(1, Number($('#movDesde').value) || 1);
  const err = validarFichaje(eid, entra, sale, desde);
  if (err) { toast(err); return; }
  const m = { equipo: eid, tipo: 'fichaje', desdeJornada: desde, sale, entra, nota: $('#movNota').value.trim().slice(0, 80), creado: new Date().toISOString(), autor: S.yo };
  guardar(() => S.db.doc('movimientos/m' + Date.now().toString(36)).set(m), `${part(eid).nombre} ficha a ${jug(entra).n} por ${jug(sale).n}`);
}
function borrarMovimiento(m) {
  const antes = S.movsDb; S.movsDb = S.movsDb.filter(x => x !== m);
  let choque = null;
  for (const n of jornadasDesde(m.desdeJornada)) { const ds = participantes().filter(p => plantillaEn(p.id, n).includes(m.sale)); if (ds.length > 1) { choque = `No se puede deshacer: ${jug(m.sale).n} ya lo ha fichado otro equipo después.`; break; } }
  S.movsDb = antes;
  if (choque) { toast(choque); return; }
  guardar(() => S.db.doc('movimientos/' + m._id).delete(), 'Fichaje deshecho'); }

  if (ses && W && !W.sinConfig && S.cargado) ses.replaceChildren(W.usuario
    ? h('button', { class: 'ghost', style: 'padding:3px 10px', onclick: () => W.salir() }, 'Salir')
    : h('button', { style: 'padding:4px 12px', onclick: () => W.entrar() }, 'Entrar con Google'));
  const vista = $('#vista');
  const avisos = [];
  if (W && W.usuario && !W.propietario && S.cargado) avisos.push(h('div', { class: 'banner' }, h('div', {}, h('b', {}, 'La liga aún no tiene administrador. '), 'Quien pulse este botón será el propietario de la liga (fichajes, reglas, jornadas y permisos). Debe hacerlo Antonio antes de compartir el enlace. '),
    h('button', { onclick: e => confirmar(e.currentTarget, () => W.reclamarPropietario().catch(err => { console.error(err); toast('No se pudo: puede que otra persona ya sea el propietario.'); })) }, 'Ser el administrador')));
  if (S.error) avisos.push(h('div', { class: 'banner' }, S.error));
  if (S.cargado && S.yo && !mio && nombre !== 'equipos') avisos.push(h('div', { class: 'banner' }, h('div', {}, 'Elige tu equipo en ', h('a', { href: '#equipos' }, 'Equipos'), ' para poder hacer tu alineación.')));
  const activo = document.activeElement?.id, scroll = window.scrollY;
  vista.replaceChildren(...avisos, ...VISTAS[nombre]());
  if (activo && document.getElementById(activo)) document.getElementById(activo).focus({ preventScroll: true });
  window.scrollTo(0, scroll);
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

async function iniciar() {
  render();
  const listo = { aj: false, mov: false, al: false };
  const fin = () => { if (Object.values(listo).every(Boolean)) { clearTimeout(timer); S.cargado = true; } render(); cargarNombres(); };
  const timer = setTimeout(() => { if (!S.cargado) { S.error = 'La liga compartida tarda en cargar. Se muestran los datos base.'; S.cargado = true; render(); } }, 10000);
  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
  if (!db) { clearTimeout(timer); S.soloLectura = true; S.cargado = true; S.error = window.LIGA_WEB?.sinConfig ? 'La web aún no está conectada a su base de datos (falta la configuración de Firebase). Se muestran los datos base.' : 'Estás viendo la liga sin sesión: puedes consultarla, pero no guardar cambios.'; render(); return; }
  S.db = db; S.user = user;
  try { S.yo = user ? await user.id() : null; S.admin = user ? !!(await user.canEdit()) : false; } catch {}
  if (window.LIGA_WEB && !S.yo) S.soloLectura = true;
  const fallo = e => { console.error(e); S.error = 'Se perdió la conexión con la liga compartida. Vuelve a abrir la página.'; render(); };
  db.doc('liga/ajustes').onSnapshot(s => { S.ajustes = s.exists ? s.data() : null; listo.aj = true; fin(); }, fallo);
  db.collection('movimientos').onSnapshot(q => { S.movsDb = q.docs.map(d => ({ ...d.data(), _id: d.id })); listo.mov = true; fin(); }, fallo);
  db.collection('correcciones').onSnapshot(q => { S.correcciones = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); aplicarPosiciones(); render(); cargarNombres(); }, fallo);
  db.collection('alineaciones').onSnapshot(q => { S.alineaciones = q.docs.map(d => ({ ...d.data(), _id: d.id })); listo.al = true; fin(); }, fallo);
}
iniciar();
</script>
