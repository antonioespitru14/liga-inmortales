name: prueba-ff
on:
  push:
    paths: ['.github/workflows/prueba-ff.yml']
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir m && cd m
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -s -A "$UA" -o lamine.html https://www.futbolfantasy.com/jugadores/lamine-yamal/laliga-26-27
          curl -s -A "$UA" -o valles.html https://www.futbolfantasy.com/jugadores/alvaro-valles/laliga-26-27
          curl -s -A "$UA" -o levante.html https://www.futbolfantasy.com/laliga/equipos/levante
          git init -q -b muestras-ff && git add . && git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -qm muestras
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" muestras-ff
