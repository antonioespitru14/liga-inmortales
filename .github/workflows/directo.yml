name: Puntos en directo
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      jornada:
        description: 'Jornada (vacío = la abierta)'
        required: false
      forzar:
        description: 'Leer todos los jugadores aunque no haya partidos recientes'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['robot/*.py', '.github/workflows/directo.yml']
permissions:
  contents: write
concurrency:
  group: directo
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 lxml
      - name: Leer FutbolFantasy
        env:
          JORNADA: ${{ inputs.jornada || '13' }}
          FORZAR: ${{ (github.event_name != 'workflow_dispatch' || inputs.forzar) && '1' || '0' }}
        run: python robot/directo.py
      - name: Guardar cambios
        run: |
          git add -A directo.json robot/slugs.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name="Robot de la liga" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Puntos en directo"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done; exit 1
